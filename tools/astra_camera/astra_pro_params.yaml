# Orbbec Astra Pro (depth 2bc5:0403 + UVC color 2bc5:0501)
camera_name : "camera"

color_width: 640
color_height: 480
color_fps: 30
enable_color: true

ir_width: 640
ir_height: 480
ir_fps: 30
enable_ir: false

depth_width: 640
depth_height: 480
depth_fps: 30
enable_depth: true

depth_align: false
serial_number: ""
number_of_devices: 1

# Astra Pro 的 RGB 是独立 UVC 设备
uvc_camera.enable: true
uvc_camera.format: "mjpeg"
uvc_camera.vid: 0x2bc5
uvc_camera.pid: 0x0501
uvc_camera.retry_count: 100

color_roi.x : -1
color_roi.y : -1
color_roi.width: -1
color_roi.height: -1
depth_roi.x : -1
depth_roi.y : -1
depth_roi.width: -1
depth_roi.height: -1

depth_scale : 1
publish_tf: true
tf_publish_rate: 10.0
reconnect_timeout: 6.0
